<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Admin dashboard for reviewing hospital and clinic appointments by date.">
    <title>Aurelia Clinic | Admin Appointments</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <link href="admin.css" rel="stylesheet">
  </head>
  <body class="admin-body">
    <main class="admin-shell">
      <header class="admin-topbar">
        <div>
          <p class="eyebrow">Clinical administration</p>
          <h1>Admissions &amp; Bookings</h1>
        </div>
        <div class="admin-actions">
          <button class="admin-btn primary" id="simulateDemoBtn" type="button">Simulate Demo Data</button>
          <button class="admin-btn" id="exportCsvBtn" type="button">Export CSV</button>
          <button class="admin-btn" id="printRosterBtn" type="button"><i class="bi bi-printer"></i> Print Roster</button>
          <button class="admin-btn danger" id="resetDataBtn" type="button">Reset DB</button>
        </div>
      </header>

      <section class="stats-grid" aria-label="Appointment summary">
        <article class="stat-card">
          <strong id="totalCount">0</strong>
          <span>Total bookings</span>
        </article>
        <article class="stat-card">
          <strong id="newCount">0</strong>
          <span>Pending intake</span>
        </article>
        <article class="stat-card">
          <strong id="confirmedCount">0</strong>
          <span>Confirmed visits</span>
        </article>
        <article class="stat-card">
          <strong id="cancelledCount">0</strong>
          <span>Cancelled slots</span>
        </article>
      </section>

      <section class="charts-grid" aria-label="Appointment analytics">
        <article class="chart-card">
          <div class="chart-heading">
            <h2>Specialist Consultation Workload</h2>
          </div>
          <div class="chart-frame">
            <canvas id="doctorChart"></canvas>
          </div>
        </article>
        <article class="chart-card">
          <div class="chart-heading">
            <h2>Intake Ratios by Department</h2>
          </div>
          <div class="chart-frame">
            <canvas id="departmentChart"></canvas>
          </div>
        </article>
      </section>

      <section class="dashboard-panel">
        <div class="filter-bar">
          <div class="search-field">
            <label for="searchFilter" class="visually-hidden">Search</label>
            <input class="form-control" id="searchFilter" type="search" placeholder="Search patient, phone, doctor...">
          </div>
          <div>
            <label for="dateFilter" class="visually-hidden">Date</label>
            <input class="form-control" id="dateFilter" type="date">
          </div>
          <div>
            <label for="statusFilter" class="visually-hidden">Status</label>
            <select class="form-select" id="statusFilter">
              <option value="all">All Request Statuses</option>
              <option value="new">New</option>
              <option value="confirmed">Confirmed</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <button class="admin-btn compact" id="clearFilters" type="button">Clear</button>
        </div>

        <div class="dashboard-status" id="dashboardStatus" role="status"></div>
        <div class="appointments-list" id="appointmentsList"></div>
      </section>
    </main>

    <template id="dateGroupTemplate">
      <section class="date-group">
        <div class="date-heading">
          <div>
            <span class="date-kicker">Appointment date</span>
            <h2></h2>
          </div>
          <strong></strong>
        </div>
        <div class="appointment-grid"></div>
      </section>
    </template>

    <template id="appointmentCardTemplate">
      <article class="appointment-card">
        <div class="appointment-topline">
          <span class="slot"></span>
          <span class="status-pill"></span>
        </div>
        <h3></h3>
        <div class="appointment-meta">
          <a class="phone" href="#"></a>
          <a class="email" href="#"></a>
          <span class="doctor"></span>
          <span class="department"></span>
        </div>
        <p class="message"></p>
        <div class="appointment-actions">
          <button type="button" data-status="confirmed">Confirm</button>
          <button type="button" data-status="completed">Complete</button>
          <button type="button" data-status="cancelled">Cancel</button>
        </div>
      </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
